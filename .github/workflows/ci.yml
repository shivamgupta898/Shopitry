name: Shopitry CI - Build, Test and Push Images

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            context: ./backend/api-gateway
          - name: catalog-service
            context: ./backend/catalog-service
          - name: cart-service
            context: ./backend/cart-service
          - name: order-service
            context: ./backend/order-service
          - name: payment-service
            context: ./backend/payment-service
          - name: notification-service
            context: ./backend/notification-service
          - name: storefront
            context: ./frontend/storefront
          - name: admin-dashboard
            context: ./frontend/admin-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Run Unit Tests
        run: |
          cd ${{ matrix.context }}
          if [ -f "package.json" ]; then
            npm ci
            npm test --if-present
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dproject.settings=${{ matrix.context }}/sonar-project.properties

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            shivamgupta898/shopitry-${{ matrix.name }}:latest
            shivamgupta898/shopitry-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
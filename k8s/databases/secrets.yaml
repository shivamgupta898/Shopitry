apiVersion: v1
kind: Secret
metadata:
  name: shopitry-db-secrets
  namespace: shopitry
type: Opaque
stringData:
  POSTGRES_DB: "shopitry"
  POSTGRES_USER: "shopitry_admin"
  POSTGRES_PASSWORD: "ShopitryPass123"
  MONGO_INITDB_ROOT_USERNAME: "shopitry_mongo"
  MONGO_INITDB_ROOT_PASSWORD: "ShopitryMongo123"
  DATABASE_URL: "postgresql://shopitry_admin:ShopitryPass123@postgres:5432/shopitry"
  MONGO_URI: "mongodb://shopitry_mongo:ShopitryMongo123@mongodb:27017/shopitry?authSource=admin"

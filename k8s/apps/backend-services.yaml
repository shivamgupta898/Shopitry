apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shopitry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: backend
    spec:
      containers:
        - name: api-gateway
          image: shivamgupta898/shopitry-api-gateway:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: shopitry-config
            - secretRef:
                name: shopitry-db-secrets
          env:
            - name: PORT
              value: "4000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shopitry
spec:
  selector:
    app: api-gateway
  ports:
    - port: 4000
      targetPort: 4000
---

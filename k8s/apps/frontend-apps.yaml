apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: shopitry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        tier: frontend
    spec:
      containers:
        - name: storefront
          image: shivamgupta898/shopitry-storefront:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: shopitry
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 8080
---

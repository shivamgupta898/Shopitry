apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopitry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shivamgupta898/Shopitry.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
      exclude: '{argocd/*,cni/*}'
  destination:
    server: https://kubernetes.default.svc
    namespace: shopitry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
